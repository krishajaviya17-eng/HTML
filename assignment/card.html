<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 500px;
            width: 350px;
            background: darkgoldenrod;
            margin: 100px auto;
            position: relative;
            overflow: hidden;
        }

        .innerBox {
            height: 650px;
            width: 650px;
            background:
                linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.75)),
                url(https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bWFufGVufDB8fDB8fHww&auto=format&fit=crop&w=500&q=60);
            border-radius: 50%;
            position: absolute;
            top: -50px;
            left: -300px;

        }

        .innerBoxImg {
            height: 300px;
            width: 300px;
            background: url(https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Mnx8bWFufGVufDB8fDB8fHww&auto=format&fit=crop&w=500&q=60);
            background-size: cover;
            border-radius: 50%;
            position: absolute;
            top: 250px;
            left: 100px;

        }

        .txt {
            position: absolute;
            top: 50px;
            left: 50px;
            font-size: 30px;
            color: white;
        }

        .txt,
        .innerBox,
        .innerBoxImg {
            z-index: 0;
        }

        .txt {
            z-index: 1;
        }
    </style>
</head>

<body>

    <div class="box">
        <div class="txt">
            We make cards
        </div>
        <div class="innerBox"></div>
        <div class="innerBoxImg"></div>
    </div>

</body>

</html>
